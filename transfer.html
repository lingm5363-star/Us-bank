<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Horizon - Asset Transfers</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Navigation Layout */
        .sidebar {
            width: 250px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 30px 20px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            display: block;
        }

        .sidebar-menu {
            list-style: none;
            margin-top: 40px;
        }

        .sidebar-item {
            margin-bottom: 8px;
        }

        .sidebar-item a {
            display: block;
            padding: 12px 15px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
        }

        .sidebar-item a:hover, .sidebar-item.active a {
            background-color: var(--bg-main);
            color: white;
        }

        /* Main Form Layout */
        .dashboard-content {
            flex: 1;
            padding: 40px;
        }

        .transfer-card {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }

        .nav-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
        }

        .nav-btn:hover {
            background-color: var(--accent-hover);
        }

        /* LOADING ANIMATION STYLES */
        .loading-container {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-main);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--bg-input);
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Wastes time loader frame inside the separate page -->
    <div id="transfer-loader" class="loading-container">
        <div class="spinner"></div>
        <h2>Processing Asset Transfer...</h2>
        <p style="color: var(--text-muted); margin-top: 8px;">Routing transaction safely through network logs.</p>
    </div>

    <!-- Sidebar Menu navigation matching the core template layout -->
    <aside class="sidebar">
        <a href="index.html" class="brand-title">Apex Horizon</a>
        <ul class="sidebar-menu">
            <li class="sidebar-item"><a href="index.html">Account Overview</a></li>
            <li class="sidebar-item active"><a href="transfer.html">Asset Transfers</a></li>
            <li class="sidebar-item"><a href="index.html?logout=true">Terminate Session</a></li>
        </ul>
    </aside>

    <!-- Main Transfer Inputs Form -->
    <main class="dashboard-content">
        <h2 style="margin-bottom: 24px;">Initiate Asset Transfer</h2>
        <div class="transfer-card">
            <form id="transferForm" onsubmit="executeExternalTransfer(event)">
                <div class="form-group">
                    <label for="recipient-name">Recipient Name</label>
                    <input type="text" id="recipient-name" class="form-control" placeholder="e.g. John Doe" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label for="routing-num">Routing Number</label>
                        <input type="text" id="routing-num" class="form-control" placeholder="9-digit code" required>
                    </div>
                    <div class="form-group">
                        <label for="account-num">Account Number</label>
                        <input type="text" id="account-num" class="form-control" placeholder="Account identifier" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="transfer-amount">Transfer Amount ($ USD)</label>
                    <input type="number" id="transfer-amount" step="0.01" min="1" class="form-control" placeholder="0.00" required>
                </div>
                <button type="submit" class="nav-btn">Authorize Wire Transfer</button>
            </form>
        </div>
    </main>

    <script>
        function executeExternalTransfer(event) {
            event.preventDefault();
            
            // Read active setup variables out of system memory
            let savedBalance = localStorage.getItem('walletBalance');
            let currentBalance = savedBalance ? parseFloat(savedBalance) : 248510.42;
            
            const recipient = document.getElementById('recipient-name').value;
            const amount = parseFloat(document.getElementById('transfer-amount').value);

            if (amount > currentBalance) {
                alert('Transaction Failed: Insufficient funds in primary capital account.');
                return;
            }

            // Display our full-screen time-waster animation loop
            document.getElementById('transfer-loader').style.display = 'flex';
            
            setTimeout(() => {
                // Calculate and commit updates cleanly to shared memory
                currentBalance -= amount;
                localStorage.setItem('walletBalance', currentBalance);

                // Create a record of this transaction to pass to index.html
                let history = localStorage.getItem('txHistory');
                let txList = history ? JSON.parse(history) : [];
                
                txList.unshift({
                    name: recipient,
                    amount: amount,
                    date: new Date().toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' })
                });

                localStorage.setItem('txHistory', JSON.stringify(txList));

                // Send user back to index.html dashboard and skip the login
                localStorage.setItem('stayLoggedIn', 'true');
                window.location.href = "index.html";
            }, 4000); // 4-second processing speed
        }
    </script>
</body>
</html>
