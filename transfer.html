<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Horizon - Asset Transfers</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Navigation Layout */
        .sidebar {
            width: 250px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 30px 20px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            display: block;
        }

        .sidebar-menu {
            list-style: none;
            margin-top: 40px;
        }

        .sidebar-item {
            margin-bottom: 8px;
        }

        .sidebar-item a {
            display: block;
            padding: 12px 15px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
        }

        .sidebar-item a:hover, .sidebar-item.active a {
            background-color: var(--bg-main);
            color: white;
        }

        /* Main Form Layout */
        .dashboard-content {
            flex: 1;
            padding: 40px;
        }

        .transfer-card {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }

        .nav-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
        }

        .nav-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <!-- Sidebar Menu navigation matching the core template layout -->
    <aside class="sidebar">
        <a href="index.html" class="brand-title">Apex Horizon</a>
        <ul class="sidebar-menu">
            <li class="sidebar-item"><a href="index.html">Account Overview</a></li>
            <li class="sidebar-item active"><a href="transfer.html">Asset Transfers</a></li>
            <li class="sidebar-item"><a href="index.html">Terminate Session</a></li>
        </ul>
    </aside>

    <!-- Main Transfer Inputs Form -->
    <main class="dashboard-content">
        <h2 style="margin-bottom: 24px;">Initiate Asset Transfer</h2>
        <div class="transfer-card">
            <form id="transferForm" onsubmit="executeExternalTransfer(event)">
                <div class="form-group">
                    <label for="recipient-name">Recipient Name</label>
                    <input type="text" id="recipient-name" class="form-control" placeholder="e.g. John Doe" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label for="routing-num">Routing Number</label>
                        <input type="text" id="routing-num" class="form-control" placeholder="9-digit code" required>
                    </div>
                    <div class="form-group">
                        <label for="account-num">Account Number</label>
                        <input type="text" id="account-num" class="form-control" placeholder="Account identifier" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="transfer-amount">Transfer Amount ($ USD)</label>
                    <input type="number" id="transfer-amount" step="0.01" min="1" class="form-control" placeholder="0.00" required>
                </div>
                <button type="submit" class="nav-btn">Authorize Wire Transfer</button>
            </form>
        </div>
    </main>

    <script>
        function executeExternalTransfer(event) {
            event.preventDefault();
            const btn = event.target.querySelector('.nav-btn');
            btn.disabled = true;
            btn.innerText = "Processing Transfer Setup...";
            
            // Simulates processing before providing user confirmation
            setTimeout(() => {
                alert('Transfer initialized successfully. Returning to main overview.');
                window.location.href = "index.html";
            }, 3000);
        }
    </script>
</body>
</html>
